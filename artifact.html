<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shredlog</title>
<meta name="apple-mobile-web-app-title" content="Shredlog">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F28A1D">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F3F1;--bg2:#FFFFFF;--bg3:#ECEAE6;--ink:#1A1816;--ink2:#54504B;--ink3:#8A857E;--line:#DEDAD4;
  --accent:#F28A1D;--accent-ink:#FFFFFF;--accent-soft:#FDEBD6;--accent2:#FFB45C;--amber:#E2A62E;--amber-soft:#FBEFD2;--red:#D0453F;--red-soft:#F9DEDC;--blue:#3A6EA5;
  --shadow:0 1px 2px rgba(20,30,25,.08),0 6px 20px rgba(20,30,25,.06);
  --r:14px;--rs:9px;
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;--disp:"Barlow Condensed","Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151311;--bg2:#1F1C19;--bg3:#2A2622;--ink:#F1EEE9;--ink2:#BDB6AD;--ink3:#847D74;--line:#35302A;
  --accent:#FF9A2E;--accent-ink:#1A1108;--accent-soft:#3D2A12;--accent2:#FFC27A;--amber:#F0B848;--amber-soft:#3A2F14;--red:#EF6B63;--red-soft:#43221F;--blue:#7FA6D6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#151311;--bg2:#1F1C19;--bg3:#2A2622;--ink:#F1EEE9;--ink2:#BDB6AD;--ink3:#847D74;--line:#35302A;
  --accent:#FF9A2E;--accent-ink:#1A1108;--accent-soft:#3D2A12;--accent2:#FFC27A;--amber:#F0B848;--amber-soft:#3A2F14;--red:#EF6B63;--red-soft:#43221F;--blue:#7FA6D6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;padding-bottom:calc(72px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--disp);margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:34px;font-weight:800;letter-spacing:-.01em}
h2{font-size:24px;font-weight:700}
h3{font-size:19px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px;width:100%}
input[type=number]{font-variant-numeric:tabular-nums}
textarea{min-height:90px;resize:vertical}
a{color:var(--accent)}
.app{max-width:560px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 0 12px}
.band{margin:0 -16px 14px;padding:18px 16px 22px;background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);color:#fff;border-radius:0 0 26px 26px}
.band h1,.band .eyebrow,.band .muted{color:#fff}.band .eyebrow{opacity:.85}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--bg2);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--disp);font-weight:700;font-size:19px;min-height:84px}
.tile .ic{width:46px;height:46px;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none}.tile .ic svg{width:24px;height:24px}
.tile .sub{display:block;font-family:var(--font);font-weight:500;font-size:13px;color:var(--ink3);margin-top:3px}
.settbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.settbl th{font-family:var(--disp);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);text-align:center;padding:4px 2px;font-weight:600}
.settbl td{padding:5px 3px;text-align:center}
.settbl td.idx{font-family:var(--disp);font-weight:700;color:var(--ink2)}
.settbl td.prev{font-size:12.5px;color:var(--ink3)}
.settbl input{text-align:center;padding:9px 4px;font-family:var(--disp);font-size:18px;font-weight:600}
.settbl tr.done td{opacity:.55}.settbl tr.done td.chk{opacity:1}
.ctrl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-top:6px}
.ctrl .round{width:60px;height:60px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:flex;align-items:center;justify-content:center;justify-self:center}.ctrl .round svg{width:26px;height:26px}
.ctrl .round.big{width:76px;height:76px;background:var(--accent);color:#fff;border-color:var(--accent)}.ctrl .round.big svg{width:34px;height:34px}
.ctrl .round:disabled{opacity:.3}
.pct{font-family:var(--disp);font-weight:700;font-size:14px;text-align:center;color:var(--ink2);margin-bottom:6px}
.topnav{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.topnav a{font-family:var(--disp);font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px;background:var(--bg3);color:var(--ink2);text-decoration:none;white-space:nowrap}.topnav a.on{background:var(--accent);color:var(--accent-ink)}
.inline-sheet{border:2px solid var(--accent)}
.ctrl .round.big b{font-family:var(--disp);font-size:22px;font-variant-numeric:tabular-nums}
.top .eyebrow{font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.top .date{font-family:var(--disp);font-size:15px;color:var(--ink2);text-align:right}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--bg3);color:var(--ink2)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.red{background:var(--red-soft);color:var(--red)}
.card{background:var(--bg2);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card.acc{background:var(--accent);color:var(--accent-ink)}
.card.acc .muted,.card.acc .eyebrow{color:var(--accent-ink);opacity:.8}
.card.amberc{background:var(--amber-soft);border:1px solid var(--amber)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}
.eyebrow{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.small{font-size:14px}.tiny{font-size:12.5px}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums}
.big{font-family:var(--disp);font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.02em;padding:13px 18px;border-radius:var(--rs);background:var(--ink);color:var(--bg);min-height:48px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--bg3);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.wide{width:100%}
.btn.sm{font-size:15px;padding:8px 12px;min-height:38px}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}
.progress{height:8px;background:var(--bg3);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .35s ease}
.progress.amber>i{background:var(--amber)}
.list{display:flex;flex-direction:column}
.list>.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.list>.item:first-child{border-top:0}
.item .t{font-weight:600}
.item .s{font-size:13.5px;color:var(--ink2)}
.chev{color:var(--ink3);font-size:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--disp);font-weight:600;font-size:15px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg2);color:var(--ink2)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip.on.easy{border-color:var(--blue);background:transparent;color:var(--blue)}
.chip.on.hard{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.tabs{display:flex;background:var(--bg3);border-radius:var(--rs);padding:3px;gap:3px}
.tabs>button{flex:1;font-family:var(--disp);font-weight:700;font-size:15px;padding:8px;border-radius:7px;color:var(--ink2)}
.tabs>button.on{background:var(--bg2);color:var(--ink);box-shadow:var(--shadow)}
.tabs>button:disabled{opacity:.4}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none;color:transparent;background:var(--bg2)}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check svg{width:16px;height:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.field label{display:block;font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.field .unit{position:relative}
.field .unit input{padding-right:44px}
.field .unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--disp);color:var(--ink3);font-size:14px}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden;background:var(--bg2)}
.stepper button{width:54px;font-family:var(--disp);font-size:26px;font-weight:600;color:var(--accent);background:var(--bg3)}
.stepper input{border:0;border-radius:0;text-align:center;font-family:var(--disp);font-size:30px;font-weight:700;padding:6px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week>div{text-align:center;font-family:var(--disp);font-size:13px;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:6px}
.week>div i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:12px}
.week>div.done i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.week>div.today i{border-color:var(--ink)}
.week>div.rest i{border-style:dashed}
.week>div.missed i{border-color:var(--red);color:var(--red)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:20}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--ink3);font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.04em;padding:4px 0;position:relative}
.nav a.on{color:var(--accent)}
.nav a svg{width:24px;height:24px}
.nav a .dot{position:absolute;top:2px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--red)}
.view{display:none;animation:fade .18s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* démonstration exercice */
.demo{position:relative;border-radius:var(--rs);overflow:hidden;background:var(--bg3);aspect-ratio:3/2}
.confirm .btnrow{margin-top:14px}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.demo img.f1{animation:swap 2.4s ease-in-out infinite}
.demo.paused img.f1{animation-play-state:paused}
@keyframes swap{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.demo img.f1{animation:none;opacity:.0}.demo:hover img.f1{opacity:1}}
.demo .tag{position:absolute;left:8px;top:8px}
.demo .step{position:absolute;right:8px;bottom:8px;font-family:var(--disp);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:999px}
.demo.empty{display:flex;align-items:center;justify-content:center;color:var(--ink3);font-family:var(--disp);aspect-ratio:auto;min-height:80px}
.muscles{display:flex;gap:14px;align-items:center}
.muscles svg{width:150px;height:auto;flex:none}
.muscles .m{fill:var(--bg3);stroke:var(--line);stroke-width:1}
.muscles .m.p{fill:#E03A2F}
.muscles .m.s{fill:#F08A7E}
.muscles .body{fill:var(--bg2);stroke:var(--ink3);stroke-width:1.2}
.cues{margin:0;padding-left:18px;color:var(--ink2);font-size:14.5px}
.cues li{margin:3px 0}
.loadbox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.loadbox .k{background:var(--bg3);border-radius:var(--rs);padding:10px 12px}
.loadbox .k b{display:block;font-family:var(--disp);font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.loadbox .k span{font-size:12.5px;color:var(--ink3)}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 14px 10px 18px;display:none;align-items:center;gap:12px;box-shadow:var(--shadow);z-index:30;font-family:var(--disp)}
.timer.on{display:flex}
.timer b{font-size:26px;font-variant-numeric:tabular-nums;min-width:64px}
.timer.over{background:var(--accent);color:var(--accent-ink)}
.timer button{background:rgba(255,255,255,.15);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:40;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .in{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:6px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 6px;border-bottom:1px solid var(--line)}
.tbl td.r,.tbl th.r{text-align:right}
.scroll{overflow-x:auto}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos .ph{aspect-ratio:3/4;border-radius:var(--rs);background:var(--bg3);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-family:var(--disp);font-size:13px;text-align:center;padding:6px}
.photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photos .ph .lab{position:absolute;left:6px;top:6px}
.photos .ph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.spark{width:100%;height:120px;display:block}
.spark .ln{fill:none;stroke:var(--accent);stroke-width:2}
.spark .ar{fill:var(--accent);opacity:.12}
.spark .gd{stroke:var(--line);stroke-width:1}
.spark .tx{font-family:var(--disp);font-size:11px;fill:var(--ink3)}
.spark .pt{fill:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:14px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-family:var(--disp);font-weight:600;z-index:50;display:none;box-shadow:var(--shadow)}
.toast.on{display:block}
.notice{border-left:3px solid var(--amber);background:var(--amber-soft);padding:10px 12px;border-radius:0 var(--rs) var(--rs) 0;font-size:14px}
.notice.red{border-color:var(--red);background:var(--red-soft)}
.notice.acc{border-color:var(--accent);background:var(--accent-soft)}
.sup{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.sup:first-child{border-top:0}
.sup .t{font-weight:600}
.sup .s{font-size:13px;color:var(--ink2)}
.sup .why{font-size:13.5px;color:var(--ink2);margin-top:6px;display:none}
.sup.open .why{display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--ink3)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
.macro{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.macro>div{background:var(--bg3);border-radius:var(--rs);padding:8px 4px}
.macro b{display:block;font-family:var(--disp);font-size:20px;font-variant-numeric:tabular-nums}
.macro span{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-family:var(--disp)}
.ver{font-size:13px;color:var(--ink3);text-align:center;padding:16px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.exlist .item{align-items:flex-start}
.exlist .item .n{width:30px;flex:none;font-family:var(--disp);font-weight:700;color:var(--ink3)}
.reviewchg{border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.reviewchg b{font-family:var(--disp)}
.hidden{display:none!important}
</style>

</div>
